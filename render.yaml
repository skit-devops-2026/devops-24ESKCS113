# Render Blueprint Specification for SkillSwapify
# Docs: https://render.com/docs/blueprint-spec
version: "1"

services:
  # Option 1: Static Site (Recommended for HTML/CSS/JS frontend)
  # Free tier, instant edge CDN deployment, zero cold-start delay
  - type: web
    name: skillswapify
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

