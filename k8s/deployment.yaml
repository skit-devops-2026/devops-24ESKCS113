apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillswapify-deployment
  labels:
    app: skillswapify
    tier: frontend
    course: csul511
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: skillswapify
  template:
    metadata:
      labels:
        app: skillswapify
        tier: frontend
    spec:
      containers:
        - name: skillswapify
          # Container Registry Image (Docker Hub)
          # Replace 'dineshkumar2908' with your actual Docker Hub username if different
          image: dineshkumar2908/skillswapify:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
